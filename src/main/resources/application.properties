spring.application.name=banking-system-sample

# Hardcoded bearer token every request must send.
app.security.token=token-123

# Always answer in English, whatever the client's Accept-Language or the server's OS locale.
# "fixed" ignores Accept-Language; without it, Bean Validation messages switch language (e.g. Polish).
spring.web.locale=en
spring.web.locale-resolver=fixed

# All errors are rendered by ApiErrorController / GlobalExceptionHandler.
spring.web.error.whitelabel.enabled=false

# In-memory H2: wiped on every stop, rebuilt from schema.sql + data.sql on every start.
# No spring.datasource.url on purpose: Boot then creates an embedded H2 with a unique name
# per application context, so test contexts never share (and re-create) the same tables.
spring.datasource.generate-unique-name=true
spring.sql.init.mode=always

# schema.sql owns the tables; Hibernate only checks the entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql = true
#spring.jpa.properties.hibernate.format_sql=true
# Logs per-session stats (e.g. "N JDBC statements executed"), handy for spotting N+1 selects.
spring.jpa.properties.hibernate.generate_statistics=true
