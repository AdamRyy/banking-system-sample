spring.application.name=banking-system-sample

# Hardcoded bearer token every request must send.
app.security.token=token-123

# Always answer in English, whatever the client's Accept-Language or the server's OS locale.
# "fixed" ignores Accept-Language; without it, Bean Validation messages switch language (e.g. Polish).
spring.web.locale=en
spring.web.locale-resolver=fixed

# All errors are rendered by ApiErrorController / GlobalExceptionHandler.
spring.web.error.whitelabel.enabled=false
