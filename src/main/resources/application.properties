spring.application.name=banking-system-sample

# Hardcoded bearer token every request must send.
app.security.token=token-123

# Always answer in English, whatever the client's Accept-Language or the server's OS locale.
# "fixed" ignores Accept-Language; without it, Bean Validation messages switch language (e.g. Polish).
spring.web.locale=en
spring.web.locale-resolver=fixed

# All errors are rendered by ApiErrorController / GlobalExceptionHandler.
spring.web.error.whitelabel.enabled=false

# PostgreSQL from docker-compose.yml (start it with: docker compose up -d).
# Rebuilt from schema.sql + data.sql on every start, so data does not survive a restart.
# Credentials live in .env (git-ignored), shared with docker compose. Real environment variables win over it.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Required for a non-embedded database, otherwise schema.sql and data.sql are skipped.
spring.sql.init.mode=always

# schema.sql owns the tables; Hibernate only checks the entities match them.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql = true
#spring.jpa.properties.hibernate.format_sql=true
# Logs per-session stats (e.g. "N JDBC statements executed"), handy for spotting N+1 selects.
spring.jpa.properties.hibernate.generate_statistics=true
